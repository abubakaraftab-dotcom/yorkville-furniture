name: Deploy Yorkville to TEST

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy-test:
    name: Build and deploy test site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (regenerate lock file if drifted)
        run: npm ci --no-audit || (echo "Lock file drifted; regenerating from package.json..." && npm install --package-lock-only --no-audit && npm ci --no-audit)

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: /test-deploy
        run: npm run build

      - name: Push regenerated lock file back (only if changed)
        if: hashFiles('package-lock.json') != ''
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "ci: regenerate package-lock.json after drift" || exit 0
            git push origin main || exit 0
          fi

      - name: Upload test site to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./out/
          server-dir: /public_html/test-deploy/
          dangerous-clean-slate: false
